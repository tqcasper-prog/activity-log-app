name: Life Planner domain tests

on:
  push:
    branches:
      - feat/life-health-planner-mvp
  pull_request:
    branches:
      - feat/life-health-planner-prototype
      - feat/life-health-planner-mvp

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run domain tests
        run: npm test
