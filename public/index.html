<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life & Health Planner</title>
<style>
:root{font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:#182230;background:#f4f6f8;--card:#fff;--muted:#667085;--line:#e5e9ef;--brand:#3659d9;--soft:#edf1ff;--green:#16865c;--red:#c24141}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:var(--brand);color:white;font-weight:650}button.secondary{background:#eef1f5;color:#273244}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:7px 9px;font-size:13px}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand h1{margin:0;font-size:25px}.brand p,.muted{color:var(--muted);font-size:13px}.pill{background:#e8f7ef;color:#13734e;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.nav button{background:#e9edf3;color:#344054}.nav button.active{background:var(--brand);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 3px 12px #17203308}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.wrap{flex-wrap:wrap}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tabs button{background:#f0f2f6;color:#344054}.tabs button.active{background:var(--soft);color:var(--brand)}.day{display:flex;gap:6px;flex-wrap:wrap}.day button{background:#eef1f5;color:#344054}.day button.active{background:var(--brand);color:#fff}.activity,.food{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.activity .meta,.food .meta{font-size:12px;color:var(--muted);margin:5px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;color:#475467;font-weight:650}input,select,textarea{width:100%;border:1px solid #d5dbe5;border-radius:9px;padding:10px;background:white;color:#182230}textarea{min-height:72px;resize:vertical}.hidden{display:none!important}.bar{height:10px;background:#edf0f4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.macro div{background:#f6f7fa;border-radius:10px;padding:10px}.macro strong{display:block;font-size:18px}.chart{display:flex;align-items:end;gap:10px;height:180px;padding:15px 5px 0;border-bottom:1px solid var(--line)}.chart-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:6px}.chart-col i{display:block;width:min(34px,80%);background:#6680e8;border-radius:7px 7px 0 0;min-height:2px}.chart-col small{font-size:10px;color:var(--muted);text-align:center}.chart-col b{font-size:10px}.note{background:#f0f5ff;border-radius:12px;padding:13px;color:#34466e;font-size:14px;line-height:1.65}.footer{font-size:12px;color:var(--muted);padding:12px 2px}.empty{color:var(--muted);padding:18px;text-align:center}.two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
@media(max-width:760px){.shell{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:21px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><h1>Life & Health Planner</h1><p>วางแผนชีวิต · ติดตามสุขภาพ · วิเคราะห์ความก้าวหน้า</p></div><span class="pill">Prototype · บันทึกในเครื่อง</span></header>
<section class="grid" id="stats"></section>
<nav class="nav" id="nav"></nav>
<section id="view"></section>
<p class="footer">ข้อมูลต้นแบบเก็บใน LocalStorage ของเบราว์เซอร์นี้เท่านั้น ยังไม่มีบัญชีผู้ใช้หรือการซิงก์ข้ามอุปกรณ์ · ตัวเลขโภชนาการเป็นค่าประมาณ</p>
</main>
<script>
const DAYS=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const CATS=['งาน','เรียน','ออกกำลังกาย','พักผ่อน','ชีวิตประจำวัน','เดินทาง','อื่น ๆ'];
const defaultActivities=DAYS.flatMap((day,i)=>[
{day,time:'06:30–07:00',name:'ตื่นนอนและเตรียมตัว',category:'ชีวิตประจำวัน'},
{day,time:'08:00–18:00',name:'ทำงาน',category:'งาน'},
{day,time:'18:00–18:40',name:'ซื้ออาหารและกินข้าว',category:'ชีวิตประจำวัน'},
{day,time:'18:40–19:20',name:'อาบน้ำและพัก',category:'ชีวิตประจำวัน'},
{day,time:'19:20–20:10',name:i===2||i>4?'พักฟื้น / เดินเบา ๆ':'ออกกำลังกาย',category:'ออกกำลังกาย'},
{day,time:'20:20–21:05',name:'เรียน Cybersecurity',category:'เรียน'},
{day,time:'21:05–21:50',name:'เล่นเกม / เวลาส่วนตัว',category:'พักผ่อน'},
{day,time:'21:50–22:00',name:'เตรียมตัวนอน',category:'ชีวิตประจำวัน'},
{day,time:'22:00–06:30',name:'นอนหลับ',category:'พักผ่อน'}
]);
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('lhp_'+k))??d}catch{return d}};
let activities=load('activities',defaultActivities),logs=load('logs',[]),foods=load('foods',[]),body=load('body',{weight:54,height:178,waist:72,sleep:8.5,water:2,note:''});
let page='ภาพรวม',day='จันทร์',period='สัปดาห์',editIndex=-1,editFood=-1;
function save(){localStorage.setItem('lhp_activities',JSON.stringify(activities));localStorage.setItem('lhp_logs',JSON.stringify(logs));localStorage.setItem('lhp_foods',JSON.stringify(foods));localStorage.setItem('lhp_body',JSON.stringify(body));render()}
function el(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){el('nav').innerHTML=['ภาพรวม','ตารางชีวิต','บันทึกเวลา','โภชนาการ','ร่างกาย','รายงาน'].map(x=>'<button class="'+(page===x?'active':'')+'" data-page="'+x+'">'+x+'</button>').join('');el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function stats(){let kcal=foods.reduce((s,f)=>s+f.cal,0),hrs=logs.reduce((s,x)=>s+x.hours,0),bmi=body.weight/(body.height/100)**2;el('stats').innerHTML=[['น้ำหนัก',body.weight+' kg'],['BMI',Number.isFinite(bmi)?bmi.toFixed(1):'—'],['อาหารวันนี้',kcal+' kcal'],['เวลาที่บันทึก',hrs.toFixed(1)+' ชม.']].map(x=>'<div class="card stat"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('')}
function dayPicker(){return '<div class="day">'+DAYS.map(d=>'<button class="'+(d===day?'active':'')+'" data-day="'+d+'">'+d+'</button>').join('')+'</div>'}
function activityForm(a={}){return '<div class="card"><h3>'+(editIndex<0?'เพิ่มกิจกรรม':'แก้ไขกิจกรรม')+'</h3><form id="activityForm" class="form"><div class="field"><label>ชื่อกิจกรรม</label><input name="name" required value="'+esc(a.name||'')+'"></div><div class="field"><label>เวลา (เช่น 18:00–18:40)</label><input name="time" required value="'+esc(a.time||'')+'"></div><div class="field"><label>หมวดหมู่</label><select name="category">'+CATS.map(c=>'<option '+(a.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div class="field"><label>วันที่</label><select name="day">'+DAYS.map(d=>'<option '+((a.day||day)===d?'selected':'')+'>'+d+'</option>').join('')+'</select></div><div class="field full actions"><button>บันทึกกิจกรรม</button><button type="button" class="secondary" id="cancelActivity">ยกเลิก</button></div></form></div>'}
function renderSchedule(){let list=activities.map((a,i)=>({...a,i})).filter(a=>a.day===day).sort((a,b)=>a.time.localeCompare(b.time));return '<h2>ตารางชีวิต</h2><p class="muted">เลือกวัน แล้วเพิ่ม แก้ไข ลบ หรือย้ายกิจกรรมได้</p>'+dayPicker()+'<div id="activityList">'+(list.length?list.map(a=>'<div class="activity"><div class="row"><b>'+esc(a.name)+'</b><span class="pill">'+esc(a.category)+'</span></div><div class="meta">'+esc(a.time)+' · '+esc(a.day)+'</div><div class="actions"><button class="small secondary" data-edit="'+a.i+'">แก้ไข</button><button class="small danger" data-delete="'+a.i+'">ลบ</button></div></div>').join(''):'<div class="empty">ยังไม่มีกิจกรรมในวันนี้</div>')+'</div><button id="addActivity">+ เพิ่มกิจกรรม</button><div id="activityEditor"></div>'}
function renderLogs(){return '<h2>บันทึกเวลาที่ใช้จริง</h2><p class="muted">กรอกกิจกรรมและชั่วโมงที่ใช้จริง ระบบจะรวมเวลาแยกตามหมวดหมู่ให้</p><div class="card"><form id="logForm" class="form"><div class="field"><label>วันที่</label><select name="day">'+DAYS.map(d=>'<option>'+d+'</option>').join('')+'</select></div><div class="field"><label>หมวดหมู่</label><select name="category">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field"><label>รายละเอียด (ไม่บังคับ)</label><input name="detail" placeholder="เช่น ทำแบบฝึกหัด Python"></div><div class="field"><label>ชั่วโมงที่ใช้</label><input name="hours" type="number" min=".05" max="24" step=".05" required placeholder="1.5"></div><div class="field full"><button>เพิ่มบันทึกเวลา</button></div></form></div><div class="card"><h3>เวลาสะสมตามหมวดหมู่</h3>'+CATS.map(c=>{let h=logs.filter(x=>x.category===c).reduce((s,x)=>s+x.hours,0);let total=logs.reduce((s,x)=>s+x.hours,0);return '<p class="row"><span>'+c+'</span><b>'+h.toFixed(1)+' ชม.</b></p><div class="bar"><span style="width:'+(total?h/total*100:0)+'%"></span></div>'}).join('')+'</div><div class="card"><h3>รายการล่าสุด</h3>'+logs.slice(-12).reverse().map((x,i)=>'<div class="activity row"><span>'+esc(x.day)+' · '+esc(x.category)+'<div class="meta">'+esc(x.detail||'')+'</div></span><b>'+x.hours+' ชม.</b><button class="small danger" data-logdel="'+(logs.length-1-i)+'">ลบ</button></div>').join('')+'</div>'}
function renderFood(){let sum=k=>foods.reduce((s,x)=>s+(Number(x[k])||0),0),goal=2400;return '<h2>โภชนาการ</h2><p class="muted">เพิ่มอาหารที่กินจริงและกรอกสารอาหารจากฉลากหรือฐานข้อมูลที่เชื่อถือได้</p><div class="card"><div class="row"><b>พลังงานที่บันทึก</b><strong>'+sum('cal')+' / '+goal+' kcal</strong></div><div class="bar"><span style="width:'+Math.min(100,sum('cal')/goal*100)+'%"></span></div><div class="macro"><div>โปรตีน<strong>'+sum('protein')+' g</strong></div><div>คาร์บ<strong>'+sum('carb')+' g</strong></div><div>ไขมัน<strong>'+sum('fat')+' g</strong></div></div></div><div class="card"><h3>'+(editFood<0?'เพิ่มอาหาร':'แก้ไขอาหาร')+'</h3><form id="foodForm" class="form"><div class="field full"><label>ชื่ออาหาร / ปริมาณ</label><input name="name" required placeholder="เช่น ข้าวกะเพราไก่ 1 จาน"></div><div class="field"><label>มื้ออาหาร</label><select name="meal"><option>เช้า</option><option>กลางวัน</option><option>เย็น</option><option>ของว่าง</option></select></div><div class="field"><label>พลังงาน (kcal)</label><input name="cal" type="number" min="0" required></div><div class="field"><label>โปรตีน (g)</label><input name="protein" type="number" min="0" required></div><div class="field"><label>คาร์โบไฮเดรต (g)</label><input name="carb" type="number" min="0" required></div><div class="field"><label>ไขมัน (g)</label><input name="fat" type="number" min="0" required></div><div class="field full"><button>บันทึกอาหาร</button></div></form></div><div class="card"><h3>รายการอาหารวันนี้</h3>'+(foods.length?foods.map((f,i)=>'<div class="food"><div class="row"><b>'+esc(f.name)+'</b><span class="pill">'+esc(f.meal)+'</span></div><div class="meta">'+f.cal+' kcal · P '+f.protein+'g · C '+f.carb+'g · F '+f.fat+'g</div><div class="actions"><button class="small secondary" data-foodedit="'+i+'">แก้ไข</button><button class="small danger" data-fooddel="'+i+'">ลบ</button></div></div>').join(''):'<div class="empty">ยังไม่มีรายการอาหาร</div>')+'</div><div class="note"><b>ผู้ช่วยสรุปเบื้องต้น</b><br>'+ (sum('protein')<100?'โปรตีนที่บันทึกยังต่ำกว่าเป้าหมายตัวอย่าง 100 กรัม ลองเพิ่มไข่ นม ปลา ไก่ หรือเต้าหู้ในมื้อถัดไป':'โปรตีนถึงเป้าหมายตัวอย่างแล้ว')+'<br>'+(sum('cal')<goal?'พลังงานยังขาดประมาณ '+(goal-sum('cal'))+' kcal เทียบกับเป้าหมายตั้งต้น':'พลังงานถึงเป้าหมายตัวอย่างแล้ว')+'<br><small>เป็นการประเมินจากข้อมูลที่กรอก ไม่ใช่คำแนะนำทางการแพทย์ และค่าจริงขึ้นกับปริมาณอาหาร</small></div>'}
function renderBody(){return '<h2>ข้อมูลร่างกาย</h2><div class="card"><form id="bodyForm" class="form">'+[['weight','น้ำหนัก (kg)'],['height','ส่วนสูง (cm)'],['waist','รอบเอว (cm)'],['sleep','เวลานอนเฉลี่ย (ชม.)'],['water','น้ำดื่ม (ลิตร/วัน)']].map(([k,l])=>'<div class="field"><label>'+l+'</label><input name="'+k+'" type="number" min="0" step=".1" value="'+esc(body[k])+'"></div>').join('')+'<div class="field full"><label>หมายเหตุ / ความรู้สึก / การฟื้นตัว</label><textarea name="note">'+esc(body.note)+'</textarea></div><div class="field full"><button>บันทึกค่าร่างกาย</button></div></form></div><div class="grid"><div class="card stat"><small>BMI</small><strong>'+(body.weight/(body.height/100)**2).toFixed(1)+'</strong></div><div class="card stat"><small>น้ำหนัก</small><strong>'+body.weight+' kg</strong></div></div><div class="note">BMI เป็นตัวชี้วัดคัดกรองเบื้องต้น ไม่ได้บอกมวลกล้ามเนื้อหรือสุขภาพทั้งหมด ควรดูแนวโน้มและข้อมูลอื่นร่วมด้วย</div>'}
function chart(title,labels,values){let max=Math.max(1,...values);return '<div class="card"><h3>'+title+'</h3><div class="chart">'+labels.map((l,i)=>'<div class="chart-col"><b>'+values[i].toFixed(1)+'</b><i style="height:'+Math.max(2,values[i]/max*125)+'px"></i><small>'+l+'</small></div>').join('')+'</div></div>'}
function renderReport(){let keys=period==='สัปดาห์'?DAYS:period==='เดือน'?['สัปดาห์ 1','สัปดาห์ 2','สัปดาห์ 3','สัปดาห์ 4']:['ม.ค.','มี.ค.','พ.ค.','ก.ค.','ก.ย.','พ.ย.'];let vals=keys.map((k,i)=>period==='สัปดาห์'?logs.filter(x=>x.day===k).reduce((s,x)=>s+x.hours,0):logs.reduce((s,x)=>s+x.hours,0)/keys.length);let cats=CATS.map(c=>logs.filter(x=>x.category===c).reduce((s,x)=>s+x.hours,0));return '<h2>รายงานและกราฟ</h2><p class="muted">กราฟนี้สรุปจากบันทึกเวลาที่คุณเพิ่มไว้ในเครื่อง</p><div class="tabs">'+['สัปดาห์','เดือน','ปี'].map(p=>'<button class="'+(period===p?'active':'')+'" data-period="'+p+'">'+p+'</button>').join('')+'</div>'+chart('ชั่วโมงที่บันทึกตามช่วงเวลา',keys,vals)+chart('เวลารวมแยกตามหมวดหมู่',CATS,cats)+'<div class="card"><h3>สรุปข้อมูลโภชนาการที่บันทึก</h3><div class="macro">'+[['พลังงาน',foods.reduce((s,x)=>s+x.cal,0)+' kcal'],['โปรตีน',foods.reduce((s,x)=>s+x.protein,0)+' g'],['คาร์บ',foods.reduce((s,x)=>s+x.carb,0)+' g']].map(x=>'<div>'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><p class="muted">ในเวอร์ชันเต็มจะมีตัวกรองวันที่และประวัติย้อนหลังจริงสำหรับทุกสัปดาห์ เดือน และปี</p></div>'}
function render(){stats();nav();let v=el('view');v.innerHTML=page==='ตารางชีวิต'?renderSchedule():page==='บันทึกเวลา'?renderLogs():page==='โภชนาการ'?renderFood():page==='ร่างกาย'?renderBody():page==='รายงาน'?renderReport():'<h2>ภาพรวมวันนี้</h2><div class="note"><b>ยินดีต้อนรับ</b><br>เริ่มจากจัดตารางชีวิต บันทึกเวลาที่ใช้จริง เพิ่มอาหาร และอัปเดตค่าร่างกาย ระบบจะนำข้อมูลที่คุณกรอกมาสรุปให้</div><div class="grid" style="margin-top:14px"><div class="card stat"><small>กิจกรรมในตาราง</small><strong>'+activities.length+'</strong></div><div class="card stat"><small>บันทึกเวลา</small><strong>'+logs.length+'</strong></div><div class="card stat"><small>รายการอาหาร</small><strong>'+foods.length+'</strong></div><div class="card stat"><small>ชั่วโมงนอน</small><strong>'+body.sleep+'</strong></div></div><div class="card"><h3>สิ่งที่ควรทำวันนี้</h3><p>1. ตรวจตารางและปรับกิจกรรมที่เปลี่ยนแปลง</p><p>2. บันทึกเวลาที่ใช้จริงเมื่อจบกิจกรรม</p><p>3. เพิ่มอาหารและปริมาณที่รับประทาน</p><p>4. บันทึกการฝึกและค่าร่างกายเป็นระยะ</p></div>';
v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;editIndex=-1;render()});
let add=v.querySelector('#addActivity');if(add)add.onclick=()=>{editIndex=-1;el('activityEditor').innerHTML=activityForm();bindActivityForm()};
v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editIndex=Number(b.dataset.edit);el('activityEditor').innerHTML=activityForm(activities[editIndex]);bindActivityForm()});
v.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('ลบกิจกรรมนี้หรือไม่?')){activities.splice(Number(b.dataset.delete),1);save()}});
v.querySelectorAll('[data-logdel]').forEach(b=>b.onclick=()=>{logs.splice(Number(b.dataset.logdel),1);save()});
v.querySelectorAll('[data-fooddel]').forEach(b=>b.onclick=()=>{foods.splice(Number(b.dataset.fooddel),1);save()});
v.querySelectorAll('[data-foodedit]').forEach(b=>{let i=Number(b.dataset.foodedit),f=foods[i],form=v.querySelector('#foodForm');['name','meal','cal','protein','carb','fat'].forEach(k=>form.elements[k].value=f[k]);editFood=i});
v.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});
let lf=v.querySelector('#logForm');if(lf)lf.onsubmit=e=>{e.preventDefault();let d=new FormData(lf);logs.push({day:d.get('day'),category:d.get('category'),detail:d.get('detail'),hours:Number(d.get('hours'))});save()};
let ff=v.querySelector('#foodForm');if(ff)ff.onsubmit=e=>{e.preventDefault();let d=new FormData(ff),f=Object.fromEntries(['name','meal','cal','protein','carb','fat'].map(k=>[k,['cal','protein','carb','fat'].includes(k)?Number(d.get(k)):d.get(k)]));if(editFood>=0)foods[editFood]=f;else foods.push(f);editFood=-1;save()};
let bf=v.querySelector('#bodyForm');if(bf)bf.onsubmit=e=>{e.preventDefault();let d=new FormData(bf);body={weight:Number(d.get('weight')),height:Number(d.get('height')),waist:Number(d.get('waist')),sleep:Number(d.get('sleep')),water:Number(d.get('water')),note:d.get('note')};save()};
}
function bindActivityForm(){let f=el('activityForm');f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),a=Object.fromEntries(d.entries());if(editIndex>=0)activities[editIndex]=a;else activities.push(a);editIndex=-1;save()};el('cancelActivity').onclick=()=>{editIndex=-1;el('activityEditor').innerHTML=''}}
render();
</script></body></html>
