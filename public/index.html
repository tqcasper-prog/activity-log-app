<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f6">
  <meta name="description" content="วางแผนชีวิตประจำวัน บันทึกเวลา ออกกำลังกาย โภชนาการ และข้อมูลร่างกายในที่เดียว">
  <title>Life & Health Planner</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">+</div>
        <div><h1>Life & Health Planner</h1><p>วางแผนชีวิต · ดูแลสุขภาพ · เข้าใจตัวเอง</p></div>
      </div>
      <div class="top-actions">
        <label class="date-chip">วันที่ <input id="global-date" type="date" aria-label="เลือกวันที่หลัก"></label>
        <span class="status-chip" id="status">บันทึกในอุปกรณ์นี้</span>
      </div>
    </header>
    <nav class="nav" id="nav" aria-label="เมนูหลัก"></nav>
    <div class="toast" id="notice" role="status" aria-live="polite"></div>
    <section id="view" aria-live="polite"></section>
    <footer class="footer">ข้อมูลจัดเก็บในเบราว์เซอร์ของอุปกรณ์นี้ · ค่าทางโภชนาการเป็นค่าประมาณ · ไม่ใช่เครื่องมือวินิจฉัยทางการแพทย์</footer>
  </main>
  <script src="/storage.js"></script>
  <script src="/domain.js"></script>
  <script src="/auth.js"></script>
  <script src="/app.js"></script>
</body>
</html>
