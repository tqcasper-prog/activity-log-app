name: CI/CD Pipeline

# กำหนดให้ทำงานเมื่อมีการ Push โค้ดเข้ากิ่ง main และ staging ตามที่โจทย์ระบุ
on:
  push:
    branches:
      - main
      - staging

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Dependencies
      run: npm install

    - name: Run Test
      run: npm test

    - name: Build Docker Image
      run: docker build -t activity-log-app .